<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Pertemuan 11</title>
    <style>
        /* ── Reset & Base ───────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ── Main Content ───────────────────────────────────────── */
        .content-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ── Header Section (Pengganti Navbar) ──────────────────── */
        .header-section {
            text-align: center;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 600;
            color: #3b82f6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .page-heading {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f8fafc;
        }

        /* ── Profile Card ───────────────────────────────────────── */
        .profile-card {
            background: #1e293b;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            overflow: hidden;
        }

        .profile-card-header {
            background-color: #1e3a8a; /* Deep Blue Header */
            padding: 20px 24px;
            border-bottom: 1px solid #172554;
        }

        .profile-card-header p {
            font-size: 0.78rem;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-card-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .profile-card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── Data Row ───────────────────────────────────────────── */
        .data-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }

        .data-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .data-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: #f8fafc;
        }

        /* ── Card Footer & Logout ───────────────────────────────── */
        .profile-card-footer {
            padding: 0 24px 24px 24px;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background-color: transparent;
            color: #fca5a5;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-logout:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.5);
        }

        .btn-logout:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="content-wrapper">
    <div class="header-section">
        <div class="brand">Pertemuan 11</div>
        <h1 class="page-heading">Selamat Datang!</h1>
    </div>

    <div class="profile-card">
        <div class="profile-card-header">
            <p>Profil Pengguna</p>
            <h2 th:text="${profile.nama}">Nama Pengguna</h2>
        </div>

        <div class="profile-card-body">
            <div class="data-row">
                <span class="data-label">Nama Lengkap</span>
                <span class="data-value" th:text="${profile.nama}">—</span>
            </div>

            <div class="data-row" style="border-bottom: none; padding-bottom: 0;">
                <span class="data-label">Alamat</span>
                <span class="data-value" th:text="${profile.alamat}">—</span>
            </div>
        </div>

        <div class="profile-card-footer">
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn-logout">Keluar dari Akun</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
