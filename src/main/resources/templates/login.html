<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Pertemuan 11</title>
    <style>
        /* ── Reset & Base ───────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #0f172a; /* Dark background */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            color: #f8fafc;
        }

        /* ── Page Wrapper ───────────────────────────────────────── */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 396px;
        }

        /* ── Brand Header ───────────────────────────────────────── */
        .brand {
            font-size: 2.4rem;
            font-weight: 700;
            color: #3b82f6; /* Lighter blue for dark mode contrast */
            letter-spacing: -0.5px;
            user-select: none;
            text-align: center;
        }

        .brand-sub {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 4px;
            text-align: center;
            line-height: 1.5;
        }

        /* ── Card ───────────────────────────────────────────────── */
        .card {
            width: 100%;
            background: #1e293b; /* Dark card background */
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            padding: 28px 24px;
        }

        /* ── Error Alert ────────────────────────────────────────── */
        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            color: #fca5a5;
            font-size: 0.88rem;
            padding: 12px 14px;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
        }

        /* ── Form Elements ──────────────────────────────────────── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid #334155;
            border-radius: 6px;
            outline: none;
            color: #f8fafc;
            background: #0f172a;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input::placeholder {
            color: #64748b;
        }

        /* ── Submit Button ──────────────────────────────────────── */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #1e3a8a; /* Deep Blue */
            color: #FFFFFF;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background-color: #172554; /* Darker Deep Blue */
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* ── Divider ────────────────────────────────────────────── */
        .divider {
            height: 1px;
            background-color: #334155;
            margin: 24px 0;
        }

        /* ── Footer Link ────────────────────────────────────────── */
        .footer-text {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .footer-text a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .footer-text a:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div>
        <div class="brand">Pertemuan 11</div>
        <p class="brand-sub">Masuk untuk melanjutkan ke aplikasi</p>
    </div>

    <div class="card">
        <div class="alert-error" th:if="${param.error}">
            Username atau password salah. Silakan coba lagi.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <input type="text"
                       name="username"
                       placeholder="Username"
                       autocomplete="username">

                <input type="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary">
                Masuk
            </button>
        </form>

        <div class="divider"></div>

        <p class="footer-text">
            Belum punya akun?
            <a th:href="@{/register}">Daftar sekarang</a>
        </p>
    </div>
</div>

</body>
</html>
